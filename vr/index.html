<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restitution 3D — Tours à travers les âges</title>
  <!--
    Visite d'une restitution 3D en réalité virtuelle (WebXR, three.js).
    Le script vr.js est construit depuis tools/vr/src/main.js (cd tools/vr &&
    npm install && npm run build) : three.js y est embarqué, sans internet,
    et compilé pour les navigateurs anciens (Oculus Go).
    Paramètres : ?model=<id> (assets/data/models/<id>.json et assets/models/<id>.glb) ;
    &view=x,y,z,cx,cy,cz (point de vue), &fov=<degrés>, &shot (sans interface, captures).
    Sans casque : souris (tourner, zoomer). Avec casque : « Entrer en VR » ;
    stick gauche pour marcher, stick droit pour pivoter, gâchette pour
    aller au point visé.
  -->
  <style>
    :root { --bg: #dde6ee; --fg: #1d2530; --card: rgba(255,255,255,.88); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b2129; --fg: #e8edf2; --card: rgba(20,26,34,.88); }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
    #info { position: absolute; top: 12px; left: 12px; right: 12px; max-width: 640px;
      background: var(--card); padding: 10px 14px; border-radius: 10px; }
    #info h1 { font-size: 18px; margin: 0 0 4px; }
    #info p { margin: 4px 0; font-size: 13px; }
    #info button { font: inherit; margin-top: 6px; }
    #vr { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      font: 16px system-ui, sans-serif; padding: 12px 20px; border-radius: 8px;
      border: 1px solid var(--fg); background: var(--card); color: var(--fg); }
  </style>
</head>
<body>
  <div id="info">
    <h1 id="title">Chargement…</h1>
    <p id="summary"></p>
    <p>Sans casque : glisser pour tourner, molette pour zoomer. Avec un casque :
      « Entrer en réalité virtuelle », stick gauche pour marcher, stick droit pour pivoter,
      gâchette pour aller au point visé. Oculus Go : pavé tactile pour marcher
      (haut, bas) et pivoter (gauche, droite).</p>
    <button id="hide">Masquer</button>
  </div>
  <button id="vr" disabled>Réalité virtuelle…</button>
  <script src="vr.js"></script>
</body>
</html>
